# ---------------------------------------------------------------------------
activity_factors:
  fertilizer_n:
    value: null
    unit: kg_CO2e_per_kg_N
    source: "CHƯA CHỐT — dự kiến IPCC direct+indirect N2O"
    review_by: 2026-09-15
  straw_management:
    burned: { value: null, source: "CHƯA CHỐT", review_by: 2026-09-15 }
    incorporated: { value: null, source: "CHƯA CHỐT", review_by: 2026-09-15 }
    removed: { value: null, source: "CHƯA CHỐT", review_by: 2026-09-15 }
  diesel_pumping:
    value: null
    unit: kg_CO2e_per_litre
    source: "CHƯA CHỐT"
