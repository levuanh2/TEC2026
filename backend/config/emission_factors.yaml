# AgriCarbon — Emission Factor & hằng số tham chiếu
#
# QUY TẮC: mọi con số dùng trong Carbon Engine phải nằm ở file này, kèm `source` và
# `review_by`. KHÔNG hardcode magic number trong code tính toán (SRS — Ràng buộc RB-01).
#
# Trạng thái file: NHÁP. Chưa đối chiếu với hướng dẫn MRV chính thức
# (Quyết định 4801/QĐ-BNNMT, 14/11/2025). Xem `open_issues` cuối file.

version: 0.1.0-draft
updated: 2026-09-07

# ---------------------------------------------------------------------------
# 1. Baseline tham chiếu cấp sản phẩm (kg CO2e / kg lúa)
# ---------------------------------------------------------------------------
product_baseline:
  average:
    value: 1.04
    unit: kg_CO2_per_kg_rice
    source: "AgriCarbon_v2_Rice_Decision_and_Roadmap.md §1a.2 — hệ số tham chiếu Việt Nam"
    review_by: 2026-09-15
    note: >
      Tài liệu gốc ghi ~1,04 kg CO2/kg lúa là mức trung bình, đồng thời ghi dải
      2,29–3,72 kg CO2e/kg tùy phương pháp canh tác. Hai con số này chưa nhất quán
      về phạm vi (khí nhà kính nào, ranh giới hệ thống nào). PHẢI làm rõ trước khi
      dùng làm baseline trong báo cáo — xem open_issues.OI-01.
  range_by_practice:
    min: 2.29
    max: 3.72
    unit: kg_CO2e_per_kg_rice
    source: "AgriCarbon_v2_Rice_Decision_and_Roadmap.md §1a.2"
    review_by: 2026-09-15

# ---------------------------------------------------------------------------
# 2. Hệ số theo chế độ tưới — biến số carbon lớn nhất của lúa nước
# ---------------------------------------------------------------------------
# CH4 từ ruộng ngập là nguồn phát thải chi phối. AWD (tưới ngập-khô xen kẽ) giảm
# đáng kể so với tưới ngập liên tục (continuous flooding).
water_regime:
  continuous_flooding:
    ch4_scaling_factor: null      # TODO: lấy từ hướng dẫn MRV chính thức
    source: "CHƯA CHỐT — cần đối chiếu QĐ 4801/QĐ-BNNMT + IPCC 2019 Refinement Ch.5.5"
    review_by: 2026-09-15
  awd:
    ch4_scaling_factor: null      # TODO: lấy từ hướng dẫn MRV chính thức
    source: "CHƯA CHỐT — cần đối chiếu QĐ 4801/QĐ-BNNMT + IPCC 2019 Refinement Ch.5.5"
    review_by: 2026-09-15

# ---------------------------------------------------------------------------
