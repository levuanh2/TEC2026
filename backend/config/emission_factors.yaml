# AgriCarbon — Emission Factor & hằng số tham chiếu
#
# QUY TẮC (SRS RB-01): mọi con số Carbon Engine dùng phải nằm ở file này, kèm
# `unit`, `source`, `status`. KHÔNG hardcode magic number trong code tính toán.
#
# TRẠNG THÁI FILE: **CHƯA CÓ HỆ SỐ NÀO ĐƯỢC XÁC MINH.**
# Mọi `value` đang là null có chủ đích. Engine sẽ báo lỗi rõ ràng
# (MissingEmissionFactorError) thay vì tự dùng giá trị mặc định.
#
# Ý nghĩa `status`:
#   VERIFIED — đã đối chiếu nguồn chính thức, dùng được cho báo cáo
#   PENDING  — có trong tài liệu tham khảo nhưng nhóm CHƯA xác minh chính thức
#   VERIFY   — chưa có nguồn, phải đi tìm
#
# Xem docs/CARBON_METHOD.md để biết công thức tương ứng từng hệ số.

version: "0.1.0-draft"
review_date: "2026-09-07"

factors:

  # CH4 từ ruộng ngập — nguồn phát thải chi phối của lúa nước.
  # Công thức dự kiến: area_ha × cultivation_days × EF   (xem CARBON_METHOD.md §CH4)
  methane:
    continuous_flooding:
      value: null
      unit: null            # dự kiến kg_CO2e_per_ha_per_day
      source: "VERIFY — QĐ 4801/QĐ-BNNMT; đối chiếu IPCC 2019 Refinement Ch.5.5"
      status: "VERIFY"
      note: "Kịch bản đường cơ sở (bước 3 MRV). Chưa có hệ số chính thức."

    awd:
      value: null
      unit: null            # dự kiến kg_CO2e_per_ha_per_day
      source: "VERIFY — QĐ 4801/QĐ-BNNMT; đối chiếu IPCC 2019 Refinement Ch.5.5"
      status: "VERIFY"
      note: >
        Tưới ngập-khô xen kẽ. Hệ số điều chỉnh theo số lần rút nước
        (drainage_events) CHƯA được mô hình hóa — xem CARBON_METHOD.md,
        mục NOT IMPLEMENTED.

  # N2O từ phân đạm (trực tiếp + gián tiếp).
  # Công thức dự kiến: tổng kg N × EF   (xem CARBON_METHOD.md §N2O)
  fertilizer_n2o:
    value: null
    unit: null              # dự kiến kg_CO2e_per_kg_N
    source: "VERIFY — QĐ 4801/QĐ-BNNMT; đối chiếu IPCC direct + indirect N2O"
    status: "VERIFY"

  # Nhiên liệu bơm tưới.
  # Công thức dự kiến: số lít × EF
  fuel:
    diesel:
      value: null
      unit: null            # dự kiến kg_CO2e_per_litre
      source: "VERIFY"
      status: "VERIFY"

  # Xử lý rơm rạ. Ba phương pháp cho ba hệ số khác nhau.
  # Công thức dự kiến: khối lượng rơm (kg) × EF
  straw:
    burned:
      value: null
      unit: null            # dự kiến kg_CO2e_per_kg_straw
      source: "VERIFY"
      status: "VERIFY"
    incorporated:
      value: null
      unit: null
      source: "VERIFY"
      status: "VERIFY"
    removed:
      value: null
      unit: null
      source: "VERIFY"
      status: "VERIFY"

# ---------------------------------------------------------------------------
# Giá trị tham chiếu — KHÔNG dùng trong tính toán
# ---------------------------------------------------------------------------
# Đặt riêng ngoài `factors` có chủ đích: đây là số liệu tham chiếu ở cấp sản phẩm,
# KHÔNG phải emission factor, và Carbon Engine không được đọc mục này.
reference_values:
  status: "CONTESTED"
  note: >
    Tài liệu gốc ghi hai con số chưa nhất quán về phạm vi khí nhà kính và ranh giới
    hệ thống. KHÔNG dùng làm baseline cho tới khi giải quyết xong OI-01.
  product_average:
    value: 1.04
    unit: kg_CO2_per_kg_rice
    source: "AgriCarbon_v2_Rice_Decision_and_Roadmap.md §1a.2"
  range_by_practice:
    min: 2.29
    max: 3.72
    unit: kg_CO2e_per_kg_rice
    source: "AgriCarbon_v2_Rice_Decision_and_Roadmap.md §1a.2"

# ---------------------------------------------------------------------------
# Giá tín chỉ carbon — CHƯA CHỐT CHÍNH THỨC (SRS RB-02)
# ---------------------------------------------------------------------------
carbon_credit_price:
  value: null
  currency: USD
  unit: per_tCO2e
  status: "NOT_CONFIRMED"
  source: >
    Cơ chế TCAF (World Bank) cho Đề án 1 triệu ha, tổng ~33,3–40 triệu USD. Giá tín chỉ
    ĐANG TRONG QUÁ TRÌNH ĐỊNH GIÁ. Con số ~20 USD từng được nhắc nhưng tài liệu gốc yêu
    cầu KHÔNG trình bày như số liệu đã xác nhận.
  review_by: "2026-12-31"
  ui_rule: >
    Khi giá chưa chốt, UI/report PHẢI hiển thị nhãn "chưa chốt chính thức" hoặc ẩn hoàn
    toàn phần quy đổi tiền. Không in ra số tiền trần trụi.

# ---------------------------------------------------------------------------
# Tích hợp ngoài — CHƯA CÓ API MỞ (SRS RB-02)
# ---------------------------------------------------------------------------
external_systems:
  ricemore:
    api: "NOT_AVAILABLE"
    note: "Phủ ~75% diện tích lúa quốc gia nhưng chưa có API mở; cần partnership thể chế."
    review_by: "2026-12-31"
  farmore:
    api: "NOT_AVAILABLE"
    note: "App IRRI miễn phí, tính tCO2e/ha cấp ruộng. Dùng đối chiếu thủ công, chưa tích hợp."
    review_by: "2026-12-31"

