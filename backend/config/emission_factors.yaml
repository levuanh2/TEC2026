# ---------------------------------------------------------------------------
# 4. Giá tín chỉ carbon — CHƯA CHỐT CHÍNH THỨC
# ---------------------------------------------------------------------------
carbon_credit_price:
  value: null
  currency: USD
  unit: per_tCO2e
  status: NOT_CONFIRMED
  source: >
    Cơ chế TCAF (World Bank) cho Đề án 1 triệu ha, tổng ~33,3–40 triệu USD, giá
    tín chỉ ĐANG TRONG QUÁ TRÌNH ĐỊNH GIÁ. Con số ~20 USD từng được nhắc nhưng
    tài liệu gốc yêu cầu KHÔNG trình bày như số liệu đã xác nhận.
  review_by: 2026-12-31
  ui_rule: >
    Khi giá chưa chốt, UI/report PHẢI hiển thị dạng ước tính có nhãn "chưa chốt
    chính thức", hoặc ẩn hoàn toàn phần quy đổi tiền. Không in ra số tiền trần trụi.

# ---------------------------------------------------------------------------
# 5. Tích hợp ngoài — CHƯA CÓ API MỞ
# ---------------------------------------------------------------------------
external_systems:
  ricemore:
    api: NOT_AVAILABLE
    note: "Phủ ~75% diện tích lúa quốc gia nhưng chưa có API mở; cần partnership thể chế."
    review_by: 2026-12-31
  farmore:
    api: NOT_AVAILABLE
    note: "App IRRI miễn phí, tính tCO2e/ha cấp ruộng. Dùng để đối chiếu thủ công, chưa tích hợp."
    review_by: 2026-12-31

