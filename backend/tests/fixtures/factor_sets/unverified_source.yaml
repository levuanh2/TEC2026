# TEST FIXTURE derived from backend/config/emission_factors.yaml — deliberately broken; never import.
# AgriCarbon — Bộ tham số phương pháp luận phát thải
#
# QUY TẮC (SRS RB-01): mọi con số Carbon Engine dùng phải nằm ở file này, kèm `unit`,
# `source`, `status`. KHÔNG hardcode magic number trong code tính toán.
#
# Ý nghĩa `status`:
#   VERIFIED             — đã trích dẫn chính xác từ tài liệu gốc, ghi rõ số hiệu bảng/phương trình
#   PENDING_VERIFICATION — chưa lấy được nguồn; `value: null`; engine sẽ báo lỗi khi cần dùng
#   NOT_IMPLEMENTED      — cố ý chưa làm; xem docs/CARBON_METHOD.md
#
# Nguồn từng dòng: docs/CARBON_METHOD_SOURCES.md
# Công thức: docs/CARBON_METHOD.md
#
# ⚠️ CHƯA LẤY ĐƯỢC TOÀN VĂN QĐ 4801/QĐ-BNNMT (Tier 1). Bộ số dưới đây là **IPCC Tier 1
#    default**, KHÔNG phải hệ số đặc trưng quốc gia mà quy trình MRV yêu cầu.
#    → KHÔNG được gắn nhãn "MRV-compliant" cho bất kỳ kết quả nào.

# 0.3.0 (2026-09-15): thêm GWP AR5 (quyết định GWP basis của chủ dự án trong sprint factor readiness);
# mọi giá trị IPCC khác được đối chiếu lại với PDF gốc trong cùng ngày. Phiên bản cũ 0.2.0 KHÔNG bị ghi đè
# (chưa từng được import) — bộ hệ số là bất biến theo version_code.
version: "0.3.0-ipcc2019-tier1-ar5"
review_date: "2026-09-15"

methodology:
  name: "IPCC 2019 Refinement to the 2006 IPCC Guidelines for National GHG Inventories, Vol.4 AFOLU"
  version: "2019"
  tier: 1
  region_default: "Southeast Asia"
  status: "VERIFIED"
  gwp_basis: "AR5"
  # Chưa có chuyên gia nông học/carbon nào rà soát phương pháp luận. PENDING -> tối đa READY_FOR_DEMO.
  domain_expert_review: "PENDING"
  country_specific_factors: "NOT_USED"
  country_specific_note: >
    QĐ 2626/QĐ-BTNMT (10/10/2022) công bố hệ số Tier 2 đặc trưng quốc gia cho lúa theo VÙNG và MÙA VỤ
    (CH4, N2O-N, ROA). Engine hiện dùng IPCC 2019 Tier 1 theo CHẾ ĐỘ NƯỚC (cách mô hình hoá AWD);
    dùng hệ số QĐ 2626 cần thêm đầu vào vùng/mùa vụ và rà soát chuyên gia. Quyết định sprint 2026-09-15:
    giữ Tier 1, ghi nhận QĐ 2626 là khoảng trống có tài liệu (docs/methodology/carbon-factor-register.md).
  sources:
    - title: "2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol.4, Ch.5 Cropland"
      url: "https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch05_Cropland.pdf"
    - title: "2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol.4, Ch.11 N2O Emissions from Managed Soils"
      url: "https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    - title: "2006 IPCC Guidelines for National Greenhouse Gas Inventories, Vol.4, Ch.2 Generic Methodologies"
      url: "https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/4_Volume4/V4_02_Ch2_Generic.pdf"
    - title: "IPCC AR5 WG1 (2013), Ch.8 Anthropogenic and Natural Radiative Forcing, Table 8.A.1"
      url: "https://www.ipcc.ch/site/assets/uploads/2018/02/WG1AR5_Chapter08_FINAL.pdf"
    - title: "UNFCCC decision 18/CMA.1, annex, para 37; decision 5/CMA.3, para 25 (GWP metrics for Paris Agreement reporting)"
      url: "https://unfccc.int/sites/default/files/resource/CMA2018_03a02E.pdf"
  superseded_when: >
    Lấy được phụ lục hệ số của QĐ 4801/QĐ-BNNMT (14/11/2025). Quy trình MRV dùng hệ số
    đặc trưng quốc gia đo trực tiếp trên đồng ruộng (IPCC Tier 2), không phải default này.

# ---------------------------------------------------------------------------
# GWP — CHẶN TOÀN BỘ VIỆC RA SỐ CO2e
# ---------------------------------------------------------------------------
# Không tự chọn khung. Chênh lệch AR4 vs AR6 cho CH4 tới ~19% và đi thẳng vào con số cuối.
# Quyết định (chủ dự án, 2026-09-15): AR5 GWP-100. Căn cứ: UNFCCC 18/CMA.1 annex §37 + 5/CMA.3 §25 yêu cầu
# báo cáo theo Thoả thuận Paris dùng GWP-100 của AR5 Table 8.A.1 (không gồm methane hoá thạch); Việt Nam
# báo cáo quốc gia theo AR5. QĐ 2626/QĐ-BTNMT và QĐ 4801/QĐ-BNNMT không nêu khung GWP (QĐ 2626 đã kiểm tra).
# Một khung duy nhất cho mọi khí; KHÔNG trộn AR5 với AR6.
gwp:
  framework:
    value: "AR5"
    status: "VERIFIED"
    source: "UNFCCC decision 18/CMA.1, annex, para 37; decision 5/CMA.3, para 25"
    alternatives_not_used: "AR4 (CH4 25 / N2O 298) · AR6 WG1 Table 7.SM.7 (CH4 27,9 / N2O 273)"
  ch4:
    value: 28
    unit: "kgCO2e_per_kgCH4"
    status: "VERIFIED"
    source: "IPCC AR5 WG1 (2013), Ch.8, Table 8.A.1 — Methane, GWP 100-year (non-fossil; no climate-carbon feedback)"
    table_reference: "IPCC AR5 WG1 Ch.8 Table 8.A.1"
    uncertainty_range: "±40% (90% range, Table 8.A.1 notes)"
    note: "Methane từ ruộng lúa và đốt rơm là sinh học — giá trị 'Fossil methane' (30) không áp dụng."
  n2o:
    value: 265
    unit: "kgCO2e_per_kgN2O"
    status: "VERIFIED"
    source: "IPCC AR5 WG1 (2013), Ch.8, Table 8.A.1 — Nitrous Oxide, GWP 100-year (no climate-carbon feedback)"
    table_reference: "IPCC AR5 WG1 Ch.8 Table 8.A.1"
    uncertainty_range: "±30% (90% range, Table 8.A.1 notes)"

# ---------------------------------------------------------------------------
factors:

  # =========================================================================
  # CH4 canh tác lúa
  #   Eq 5.1 : CH4[kg] = EFi × t[ngày] × A[ha]
  #   Eq 5.2 : EFi = EFc × SFw × SFp × SFo
  # =========================================================================
  ch4_rice:

    efc:
      value: 1.22
      unit: "kgCH4_per_ha_per_day"
      status: "VERIFIED"
      source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.11 (UPDATED) — Southeast Asia"
      uncertainty_range: "0.83 – 1.81"
      note: >
        Baseline: không ngập trong <180 ngày trước canh tác, ngập liên tục trong vụ,
        KHÔNG có chất hữu cơ bổ sung. World default 1,19 (0,80–1,76).

    # SFw — chế độ nước TRONG vụ. Table 5.12 (UPDATED), cột disaggregated.
    sfw:
      irrigated_continuous_flooding:
        value: 1.00
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED), disaggregated"
        uncertainty_range: "0.73 – 1.27"
      irrigated_single_drainage:
        value: 0.71
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED), disaggregated"
        uncertainty_range: "0.53 – 0.94"
      irrigated_multiple_drainage:
        value: 0.55
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED), disaggregated"
        uncertainty_range: "0.41 – 0.72"
        note: >
          AWD (tưới ngập-khô xen kẽ) thuộc nhóm này. Nguyên văn chú thích b Table 5.12:
          "Multiple drainage periods: ... including alternate wetting and drying (AWD)."
      rainfed_regular:
        value: 0.54
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED), disaggregated"
        uncertainty_range: "0.39 – 0.74"
      rainfed_drought_prone:
        value: 0.16
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED), disaggregated"
        uncertainty_range: "0.11 – 0.24"
      deep_water:
        value: 0.06
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED), disaggregated"
        uncertainty_range: "0.03 – 0.12"
      upland:
        value: 0.0
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.12 (UPDATED)"
        note: "Ruộng không ngập trong thời gian đáng kể."

    # SFp — chế độ nước TRƯỚC vụ. Table 5.13 (UPDATED), cột disaggregated.
    # Cột aggregated KHÔNG dùng: bố cục bảng lệch khi trích từ PDF, không xác định chắc
    # giá trị 1,22 thuộc dòng nào. Xem CARBON_METHOD_SOURCES.md.
    sfp:
      non_flooded_pre_season_lt_180d:
        value: 1.00
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.13 (UPDATED), disaggregated"
        uncertainty_range: "0.88 – 1.12"
        note: "Thường gặp khi canh tác 2 vụ lúa/năm."
      non_flooded_pre_season_gt_180d:
        value: 0.89
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.13 (UPDATED), disaggregated"
        uncertainty_range: "0.80 – 0.99"
      flooded_pre_season_gt_30d:
        value: 2.41
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.13 (UPDATED), disaggregated"
        uncertainty_range: "2.13 – 2.73"
        note: "Ngập trước vụ ≥30 ngày. Làm TĂNG phát thải hơn gấp đôi — không được bỏ qua."
      non_flooded_pre_season_gt_365d:
        value: 0.59
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.13 (UPDATED), disaggregated"
        uncertainty_range: "0.41 – 0.84"
        note: "Luân canh cây trồng cạn – lúa."

    # SFo — Eq 5.3: SFo = (1 + Σ ROAi × CFOAi)^exponent, ROA tấn/ha (rơm tính khối lượng KHÔ)
    sfo_exponent:
      value: 0.59
      unit: "dimensionless"
      status: "VERIFIED"
      source: "IPCC 2019 Refinement, Vol.4, Ch.5, Equation 5.3"
      uncertainty_range: "0.54 – 0.64"

    # CFOA — Table 5.14 (UPDATED)
    cfoa:
      straw_incorporated_lt_30d:
        value: 1.00
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.14 (UPDATED)"
        uncertainty_range: "0.85 – 1.17"
        note: "Rơm vùi vào đất <30 ngày trước canh tác."
      straw_incorporated_gt_30d:
        value: 0.19
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.14 (UPDATED)"
        uncertainty_range: "0.11 – 0.28"
        note: "Rơm vùi >30 ngày trước canh tác — chỉ bằng ~1/5 so với vùi sát vụ."
      compost:
        value: 0.17
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.14 (UPDATED)"
        uncertainty_range: "0.09 – 0.29"
      farmyard_manure:
        value: 0.21
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.14 (UPDATED)"
        uncertainty_range: "0.15 – 0.28"
      green_manure:
        value: 0.45
        unit: "dimensionless"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.14 (UPDATED)"
        uncertainty_range: "0.36 – 0.57"

    # ⛔ ENGINE KHÔNG DÙNG GIÁ TRỊ NÀY. Giữ lại để tham chiếu/đối chiếu thôi.
    #    Đây là trung bình VÙNG dùng cho kiểm kê quốc gia; áp cho một thửa ruộng cụ thể
    #    trong báo cáo MRV cấp nông hộ là sai phạm vi. Thiếu ngày gieo sạ/thu hoạch thì
    #    engine raise MissingActivityDataError, không thay bằng số này.
    default_cultivation_days:
      value: 102
      unit: "day"
      status: "NOT_IMPLEMENTED"
      source: "IPCC 2019 Refinement, Vol.4, Ch.5, Table 5.11A (NEW) — Southeast Asia"
      uncertainty_range: "78 – 150"

  # =========================================================================
  # N2O từ đầu vào đạm trên ruộng lúa ngập
  #   Eq 11.1 : N2O-N = F_FR × EF1FR ;  N2O = N2O-N × 44/28
  # =========================================================================
  n2o_fertilizer:

    # EF1FR tách theo chế độ nước — AWD làm TĂNG N2O (ngược chiều với CH4).
    ef1fr:
      continuous_flooding:
        value: 0.003
        unit: "kgN2O-N_per_kgN"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.11, Table 11.1 (UPDATED), disaggregated"
        uncertainty_range: "0.000 – 0.010"
      single_and_multiple_drainage:
        value: 0.005
        unit: "kgN2O-N_per_kgN"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.11, Table 11.1 (UPDATED), disaggregated"
        uncertainty_range: "0.000 – 0.016"
        note: >
          Nguyên văn chú thích 7 Table 11.1: "Single and multiple drainage also include
          alternate wetting and drying." → AWD dùng hệ số này.
      aggregate:
        value: 0.004
        unit: "kgN2O-N_per_kgN"
        status: "VERIFIED"
        source: "IPCC 2019 Refinement, Vol.4, Ch.11, Table 11.1 (UPDATED), aggregated"
        uncertainty_range: "0.000 – 0.029"
        note: "Chỉ dùng khi không phân loại được chế độ nước."

    n2o_n_to_n2o:
      value: 1.5714285714285714
      unit: "kgN2O_per_kgN2O-N"
      status: "VERIFIED"
      source: "Tỷ lệ khối lượng phân tử 44/28 — hằng số hoá học, không phải hệ số phát thải"
      table_reference: "IPCC 2019 Refinement Vol.4 Ch.11 — N2O-N to N2O conversion 44/28"

  # =========================================================================
  # Đốt rơm rạ ngoài đồng
  #   Eq 2.27 : L = M_dm × Cf × Gef × 10⁻³ [kg khí]
  # =========================================================================
  straw_burning:

    combustion_factor_rice:
      value: 0.80
      unit: "dimensionless"
      status: "VERIFIED"
      source: "IPCC 2006 Guidelines, Vol.4, Ch.2, Table 2.6 — Rice residues, post-harvest field burning"

    gef_ch4:
      value: 2.7
      unit: "g_CH4_per_kg_dry_matter"
      status: "PENDING_VERIFICATION"
      source: "IPCC 2006 Guidelines, Vol.4, Ch.2, Table 2.5 — Agricultural residues"
      uncertainty_range: "± 1.0"

    gef_n2o:
      value: 0.07
      unit: "g_N2O_per_kg_dry_matter"
      status: "VERIFIED"
      source: "IPCC 2006 Guidelines, Vol.4, Ch.2, Table 2.5 — Agricultural residues"

    co2_counted:
      value: 0
      unit: "boolean_flag"
      status: "PENDING_VERIFICATION"
      source: >
        VERIFY — theo thông lệ IPCC, CO2 từ đốt sinh khối nông nghiệp thuộc chu trình carbon
        sinh học và không tính là phát thải ròng trong AFOLU. Cần xác nhận QĐ 4801 có theo
        thông lệ này không. Hiện engine KHÔNG tính CO2 từ đốt rơm.

  # =========================================================================
  # Nhiên liệu bơm tưới / máy móc
  # =========================================================================
  fuel:
    diesel:
      value: null
      unit: null
      status: "PENDING_VERIFICATION"
      source: "VERIFY — QĐ 2626/QĐ-BTNMT Phụ lục Năng lượng; hoặc IPCC 2006 Vol.2 Ch.3 + NCV + khối lượng riêng"
    gasoline:
      value: null
      unit: null
      status: "PENDING_VERIFICATION"
      source: "VERIFY — như diesel"
    lpg:
      value: null
      unit: null
      status: "PENDING_VERIFICATION"
      source: "VERIFY — như diesel"
    electricity_grid:
      value: null
      unit: null
      status: "PENDING_VERIFICATION"
      source: "VERIFY — hệ số lưới điện Việt Nam (bơm điện, irrigation_events.pump_energy_kwh)"

# ---------------------------------------------------------------------------
# Giá trị tham chiếu — KHÔNG phải emission factor, engine KHÔNG đọc mục này
# ---------------------------------------------------------------------------
# Đây là **emission intensity / benchmark** ở cấp sản phẩm (kg CO2e trên mỗi kg lúa),
# hoàn toàn khác loại với emission factor (kg khí trên mỗi đơn vị hoạt động).
# Dùng để đối chiếu kết quả đầu ra, TUYỆT ĐỐI không dùng làm hệ số đầu vào.
reference_values:
  kind: "emission_intensity_benchmark"
  status: "CONTESTED"
  note: >
    Hai con số dưới đây trong tài liệu gốc không nhất quán về phạm vi khí nhà kính và ranh
    giới hệ thống (1,04 ghi là kg CO2; dải kia ghi là kg CO2e; chênh nhau hơn 2 lần).
    Chưa giải quyết xong OI-01 thì không dùng làm baseline trong bất kỳ báo cáo nào.
  product_average:
    value: 1.04
    unit: "kgCO2_per_kg_rice"
    source: "AgriCarbon_v2_Rice_Decision_and_Roadmap.md §1a.2"
  range_by_practice:
    min: 2.29
    max: 3.72
    unit: "kgCO2e_per_kg_rice"
    source: "AgriCarbon_v2_Rice_Decision_and_Roadmap.md §1a.2"

# ---------------------------------------------------------------------------
# Giá tín chỉ carbon — CHƯA CHỐT CHÍNH THỨC (SRS RB-02)
# ---------------------------------------------------------------------------
carbon_credit_price:
  value: null
  currency: "USD"
  unit: "per_tCO2e"
  status: "NOT_CONFIRMED"
  source: >
    Cơ chế TCAF (World Bank) cho Đề án 1 triệu ha, tổng ~33,3–40 triệu USD. Giá tín chỉ ĐANG
    TRONG QUÁ TRÌNH ĐỊNH GIÁ. Con số ~20 USD từng được nhắc nhưng không được trình bày như
    số liệu đã xác nhận.
  review_by: "2026-12-31"
  ui_rule: >
    Khi giá chưa chốt, UI/report PHẢI hiển thị nhãn "chưa chốt chính thức" hoặc ẩn hoàn toàn
    phần quy đổi tiền.

