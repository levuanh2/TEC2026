[pytest]
# The DB target guard (tests/_db_target.py) is the FIRST plugin pytest loads -- before entry-point
# plugins, PYTEST_PLUGINS, `-p` from the command line and every conftest -- so nothing in a test
# session can reach the hosted project in backend/.env before it runs. tests/__init__.py runs it
# again for sessions that skip this file and for test modules imported outside pytest.
# `pythonpath` is applied before `-p` plugins load (pytest >= 8), so `tests` resolves here.
pythonpath = .
addopts = -p tests._db_target
