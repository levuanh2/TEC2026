<!doctype html>
<html lang="vi">
  <head>
    <!-- No favicon asset yet: declare an empty one so browsers do not request
         /favicon.ico and log a 404 on every page (CI page-health gate). -->
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking webfont: the shell paints immediately on the local
         fallback stack, then the webfonts swap in. `display=swap` already
         implies that swap, so this only moves first paint earlier — it does not
         add a second flash.
         One family, Be Vietnam Pro, for every heading, figure and body line —
         it carries the Vietnamese subset. Fraunces was dropped in Round 4.4: no
         rule referenced it any more, yet every page still downloaded it. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <title>AgriCarbon — Dashboard HTX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
