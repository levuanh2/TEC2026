<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f1e7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-render-blocking webfont: the shell paints immediately on the local
         fallback stack, then the webfonts swap in. `display=swap` already
         implies that swap, so this only moves first paint earlier — it does not
         add a second flash.
         Both families ride ONE request — Fraunces is the Farmer display face
         (figures + headings), Be Vietnam Pro stays the body face. Both carry the
         Vietnamese subset, which is why they were chosen; a display face without
         it would drop diacritics to a fallback and look broken. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap" />
    </noscript>
    <title>AgriCarbon — Dashboard HTX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
