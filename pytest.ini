[pytest]
# pytest started from the repository root (bare `pytest`, `python -m pytest ml/tests`) loads the
# backend DB target guard first, exactly as backend/pytest.ini does for backend runs: before
# entry-point plugins, PYTEST_PLUGINS, `-p` from the command line and every conftest, nothing can
# reach the hosted project in backend/.env (backend/tests/_db_target.py). Backend tests are run
# from backend/ (docs/CI_PIPELINE.md section 11); a path under backend/ selects backend/pytest.ini.
pythonpath = backend
addopts = -p tests._db_target
