# AgriCarbon monorepo CI -- the required check for main is the `ci-gate` job.
# Design, policy, exceptions, local equivalents: docs/CI_PIPELINE.md
#
# Uses NO repository secrets: everything runs against mock data or an isolated
# Supabase stack started inside the runner. Never deploys, never touches the
# hosted Supabase project, never applies migrations anywhere but that
# throw-away local stack. Every gate fails closed; the policy lives in
# scripts/ci/policy/ and relaxing it needs a `CI-Policy-Change:` commit trailer.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR supersedes the running check. Pushes to main are
# never cancelled: every commit that lands there gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `shell: bash` makes every run step `bash -eo pipefail`: a failing command in
# `cmd | tee log` fails the step instead of being masked by tee.
defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11.9"     # render.yaml PYTHON_VERSION
  NODE_VERSION: "22.18.0"      # developer toolchain; render.yaml pins none
  FLUTTER_VERSION: "3.47.4"    # stable, Dart 3.13.3
  JAVA_VERSION: "17"           # app/android compileOptions / jvmTarget
  SUPABASE_CLI_VERSION: "2.118.0"
  # Bump to invalidate every dependency cache at once (docs/CI_PIPELINE.md, "Caches").
  CACHE_EPOCH: "1"

jobs:
  # --------------------------------------------------------------- context
  # The trusted comparison base for history/coverage/contract checks: the PR's
  # target branch, or the previous main commit on push. Never PR-provided data.
  context:
    name: Context
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - id: base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Every run compares against a trusted base; no run silently skips the
          # base comparisons (policy relaxation, migrations, coverage, OpenAPI).
          case "$EVENT" in
            pull_request) base="origin/$BASE_REF" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                echo "::error title=ci context::push without a previous commit; no comparison base"
                exit 1
              fi
              base="$BEFORE" ;;
            workflow_dispatch) base="origin/$DEFAULT_BRANCH" ;;
            *) echo "::error title=ci context::unsupported event $EVENT"; exit 1 ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "comparison base: $base"

  # ------------------------------------------------------- self-integrity
  workflow-policy:
    name: Workflow + CI policy
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # actionlint also runs the runner's shellcheck over every `run:` block.
      - name: actionlint 1.7.12 (checksum-verified)
        run: |
          curl -fsSLo al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tgz" | sha256sum -c -
          tar -xzf al.tgz -C "$RUNNER_TEMP" actionlint
          rm al.tgz
          "$RUNNER_TEMP/actionlint" -color
      - name: CI policy (pins, timeouts, permissions, bypasses, gate, inventories, relaxation)
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: |
          python -m pip install --quiet "pyyaml==6.0.3"
          python scripts/ci/ci_policy.py --base-ref "$BASE"
      - name: ci-gate logic on synthetic job results
        run: bash scripts/ci/ci_gate_selftest.sh
      - name: PowerShell helper syntax (.herdr)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem .herdr -Filter *.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) { Write-Output "::error title=CI_SYNTAX::$($f.Name): $($errs[0].Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history: a secret added then removed in a PR still counts
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -fsSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tgz
      - name: Scan working tree (source, docs, workflows, render.yaml)
        run: '"$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner'
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner'
      - name: No credential or data files are tracked
        run: |
          if git ls-files | grep -E '(^|/)(key\.properties|[^/]*\.(jks|keystore|p12|pem|sqlite|db)|\.env(\.[^/]*)?|\.supabase\.env|\.mcp\.json)$' | grep -vE '\.env\.example$'; then
            echo "::error title=Secret scan::keystore, key.properties, .env, .mcp.json or database file is tracked"
            exit 1
          fi

  dependency-audit:
    name: Dependency audit
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install audit tools (pinned, checksum-verified)
        run: |
          python -m pip install --quiet "pip-audit==2.10.1"
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
      # npm high/critical fail; PyPI + pub: any advisory fails; exceptions only
      # with id/reason/owner/expiry in policy.json (expired ones fail).
      - name: Audit PyPI + npm + pub
        run: python scripts/ci/dep_audit.py --osv-scanner "$RUNNER_TEMP/osv-scanner"
      - name: Dependency changes in this PR
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: python scripts/ci/dep_audit.py --diff "$BASE"

  # ------------------------------------------------------------ backend
  backend-unit:
    name: Backend static + unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
      # Production deps + the CV stack the CV tests import (CPU wheels, as
      # ml/requirements.txt documents). Production itself runs without torch:
      # that is what `backend-startup` proves.
      - name: Install backend + CV test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.12" "torchvision>=0.29"
          python -m pip install -r ../ml/requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q -x '(^|/)\.venv/' .
      # No Supabase settings: DB/config-gated tests skip here under their exact
      # allowlisted reasons and RUN in backend-db-integration (no skips there).
      - name: pytest (no database)
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=reports/backend-unit.xml
      - name: Discovery floor + skip budget
        if: ${{ !cancelled() }}
        run: python ../scripts/ci/ci_report.py --label "Backend unit (no DB)" --junit reports/backend-unit.xml --floor backend --skips backend-unit
      # Timestamp/validation behaviour must not depend on the machine: rerun the
      # date- and parsing-sensitive modules in Vietnam time with a C locale.
      - name: Timezone + locale independence (Asia/Ho_Chi_Minh, C.UTF-8)
        env:
          TZ: Asia/Ho_Chi_Minh
          LC_ALL: C.UTF-8
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_api_contract_hardening.py tests/test_activity_writes.py tests/test_activity_writes_expansion.py
          tests/test_season_create.py tests/test_metric_completeness_order.py tests/test_carbon_engine.py
          tests/test_straw_quickfix_persistence.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports-backend-unit
          path: backend/reports/
          retention-days: 14

  backend-startup:
    name: Backend clean startup + import boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pip download cache only saves bandwidth: the script still installs
      # into a brand-new venv from backend/requirements.txt alone.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Fresh venv, isolation + import boundary + declared deps, Render start, /health + /docs
        run: bash scripts/ci/backend_startup_smoke.sh
      - name: Resolved dependency drift (warning on PRs; strict-ci fails)
        run: python scripts/ci/dep_audit.py --drift backend-resolved.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: backend-startup
          path: |
            backend-startup.log
            backend-resolved.txt
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------- migrations
  migration-static:
    name: Migrations static + checksums
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Naming, versions, checksum manifest, history against the base
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: |
          python scripts/ci/check_migrations.py --base-ref "$BASE"

  # Isolated Supabase (Postgres + Auth + PostgREST + Storage) in the runner:
  # every migration applied from an empty database, the catalog audited, then
  # the whole backend suite with the database and the configured app.
  backend-db-integration:
    name: Backend DB integration + schema audit + coverage
    needs: [context, backend-unit, migration-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml/requirements.txt
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start stack (clean apply of all migrations, fail-fast)
        run: bash scripts/ci/supabase_stack.sh
      - name: Install backend + CV test dependencies
        run: |
          python -m pip install -r backend/requirements.txt "pytest-cov==7.1.0"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.12" "torchvision>=0.29"
          python -m pip install -r ml/requirements.txt
      - name: Schema validator
        run: python scripts/validate_supabase_schema.py
      # Invariants, RLS on every table, no permissive/anon policies, no
      # privilege broadening, SECURITY DEFINER hygiene, and the committed
      # catalog snapshot (policies, grants, triggers, unique indexes).
      - name: Schema invariants + RLS policy + privilege + SECURITY DEFINER audit
        run: python scripts/ci/db_audit.py
      - name: Seed the CI database like hosted
        run: python scripts/ci/seed_ci_db.py
      - name: pytest (real database, configured app) + coverage
        working-directory: backend
        run: >-
          python -m pytest tests -q -p no:cacheprovider -rs
          --junitxml=reports/backend-db.xml
          --cov --cov-config=.coveragerc --cov-report=xml:reports/backend-coverage.xml
      - name: Discovery floor + skip budget (only the 2 CV real-model tests may skip)
        if: ${{ !cancelled() }}
        run: python scripts/ci/ci_report.py --label "Backend + DB integration" --junit backend/reports/backend-db.xml --floor backend --skips backend-db --protected backend-db --coverage backend/reports/backend-coverage.xml
      - name: Coverage no-regression + critical modules + changed lines
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: |
          python scripts/ci/coverage_gate.py --layer backend --report backend/reports/backend-coverage.xml --base-ref "$BASE"
      - name: Supabase container logs
        if: ${{ failure() }}
        run: |
          mkdir -p supabase-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do docker logs --tail 400 "$c" >"supabase-logs/$c.log" 2>&1; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports-backend-db
          path: |
            backend/reports/
            supabase-logs/
          if-no-files-found: ignore
          retention-days: 14

  # An EXISTING seeded database at the base revision -> this change's
  # migrations (or N-1 -> N when the change adds none).
  migration-upgrade:
    name: Migration upgrade (seeded base -> head)
    needs: [context, migration-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: python -m pip install -r backend/requirements.txt
      - name: Upgrade from the base revision
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: bash scripts/ci/migration_upgrade.sh "$BASE"

  # The same database rules exercised through the real HTTP surfaces: GoTrue
  # users with real JWTs against PostgREST (the Flutter sync calls) and
  # main.app in-process for FastAPI authorization. Each probe builds a
  # disposable tenant, cleans it up and verifies the cleanup; each must report
  # at least its policy minimum of checks, all passing.
  rls-security:
    name: RLS / PostgREST security (local Supabase)
    needs: [backend-unit, migration-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start stack
        working-directory: .
        run: bash scripts/ci/supabase_stack.sh
      - run: python -m pip install -r requirements.txt
      - name: Seed the CI database like hosted
        id: seed
        run: python ../scripts/ci/seed_ci_db.py
      # Each probe runs even if an earlier one failed, so one report shows every
      # broken rule; any failure still fails the job (no continue-on-error).
      - name: Lifecycle + membership via PostgREST (Flutter sync calls)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          python scripts/hosted_lifecycle_rls_probe.py --enforce | tee "$RUNNER_TEMP/lifecycle.log"
          python ../scripts/ci/ci_report.py --label "Lifecycle probe" --probe-log "$RUNNER_TEMP/lifecycle.log" --probe lifecycle
      - name: P0 security (tenant isolation, roles, MRV exports)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          python scripts/hosted_p0_security_smoke.py | tee "$RUNNER_TEMP/p0.log"
          python ../scripts/ci/ci_report.py --label "P0 security" --probe-log "$RUNNER_TEMP/p0.log" --probe p0_security
      - name: P1 correctness (season/batch, carbon persistence, lifecycle)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          python scripts/hosted_p1_correctness_smoke.py | tee "$RUNNER_TEMP/p1.log"
          python ../scripts/ci/ci_report.py --label "P1 correctness" --probe-log "$RUNNER_TEMP/p1.log" --probe p1_correctness
      - name: Write reliability (atomic writes, dead pool recovery)
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          python scripts/hosted_write_reliability_smoke.py | tee "$RUNNER_TEMP/wr.log"
          python ../scripts/ci/ci_report.py --label "Write reliability" --probe-log "$RUNNER_TEMP/wr.log" --probe write_reliability
      - name: Public sign-up stays disabled
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          python scripts/verify_public_signup_disabled.py | tee "$RUNNER_TEMP/signup.log"
          python ../scripts/ci/ci_report.py --label "Sign-up disabled" --probe-log "$RUNNER_TEMP/signup.log" --probe signup_disabled
      - name: Supabase container logs
        if: ${{ failure() }}
        working-directory: .
        run: |
          mkdir -p supabase-logs
          for c in $(docker ps -a --format '{{.Names}}' | grep '^supabase_'); do docker logs --tail 400 "$c" >"supabase-logs/$c.log" 2>&1; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: supabase-logs-rls
          path: supabase-logs/
          retention-days: 7

  # ------------------------------------------------------- API contract
  openapi-contract:
    name: OpenAPI contract
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: docs/openapi.json == generated; no unacknowledged breaking change
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: |
          python scripts/ci/openapi_check.py --base-ref "$BASE"

  # ---------------------------------------------------------------- web
  web-unit:
    name: Web typecheck + Vitest + coverage
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - run: npm ci
      # No ESLint/Prettier config exists yet (docs/CI_PIPELINE.md, "Gaps");
      # @ts-ignore/@ts-nocheck additions fail workflow-policy.
      - name: TypeScript
        run: npx tsc -b
      - name: Vitest + coverage
        run: >-
          npx vitest run --maxWorkers=2
          --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
          --coverage.enabled
      - name: Discovery floor + skip budget
        if: ${{ !cancelled() }}
        run: python3 ../scripts/ci/ci_report.py --label "Web Vitest" --junit reports/vitest.xml --floor vitest --skips vitest --coverage coverage/coverage-summary.json
      - name: Coverage no-regression + changed lines
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: |
          python3 ../scripts/ci/coverage_gate.py --layer web --report coverage/lcov.info --base-ref "$BASE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports-web-unit
          path: |
            web-dashboard/reports/
            web-dashboard/coverage/lcov.info
            web-dashboard/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  web-build:
    name: Web clean build + artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      # A clean checkout has no .env / dist / node_modules: nothing developer-made.
      - name: Clean checkout has no local state
        run: |
          for p in .env dist node_modules ../.mcp.json ../backend/.env; do
            if [ -e "$p" ]; then echo "::error title=Web build::$p exists in a clean checkout"; exit 1; fi
          done
      - run: npm ci
      # Same command as render.yaml. VITE_* are build-time and public; the
      # values here are placeholders, so this dist is a build check, not a
      # deployable staging bundle.
      - name: npm run build (real-data mode, placeholder endpoints)
        env:
          VITE_USE_MOCK_DATA: "false"
          VITE_API_BASE_URL: https://api.ci.invalid
          VITE_SUPABASE_URL: https://supabase.ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-key
        run: npm run build
      - name: No mock data, dev endpoints, server secrets or test artifacts; bundle size
        run: python3 ../scripts/ci/web_dist_check.py --dist dist --api-base https://api.ci.invalid
      - name: Artifact manifest (commit, SHA-256, build mode)
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 ../scripts/ci/artifact_manifest.py --mode web-placeholder-endpoints-not-deployable --out dist --tree
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: web-dist-${{ github.sha }}-placeholder-endpoints
          path: web-dashboard/dist/
          retention-days: 7

  # Console errors, page errors, failed requests and HTTP errors fail every
  # test (tests/e2e/fixtures.ts); ci-quality.spec.ts adds axe + overflow gates.
  playwright-mock:
    name: Playwright mock (Farmer + Management)
    needs: [web-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web-dashboard
    env:
      # Hosted specs are excluded by playwright.config.ts; make sure none of
      # their opt-in switches can be inherited here.
      REAL_E2E: "false"
      REDESIGN_QA: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-dashboard/package-lock.json
      - run: npm ci
      # The config uses channel "chrome" (Google Chrome, as developers run it).
      - name: Install Chrome + system deps
        run: npx playwright install --with-deps chrome
      - name: Playwright (mock data, CI config, 0 retries)
        run: npx playwright test
      - name: Discovery floor + skip budget
        if: ${{ !cancelled() }}
        run: python3 ../scripts/ci/ci_report.py --label "Playwright mock" --junit reports/playwright-junit.xml --floor playwright_mock --skips playwright_mock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports-playwright
          path: web-dashboard/reports/
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-failure-traces
          path: |
            web-dashboard/playwright-report/
            web-dashboard/test-results/
          retention-days: 7

  # ------------------------------------------------------------ flutter
  flutter-unit:
    name: Flutter analyze + test + coverage
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true   # SDK + pub cache, keyed on version and pubspec.lock
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      # Exits non-zero on any error, warning or lint (the tree is clean today);
      # relaxing analysis_options or adding // ignore fails workflow-policy.
      - run: flutter analyze
      # test/ only: integration_test/ needs a device and the hosted project.
      - name: flutter test + coverage
        run: >-
          mkdir -p reports &&
          flutter test --coverage --concurrency=2 --reporter failures-only
          --file-reporter json:reports/flutter.json
      - name: Discovery floor + skip budget
        if: ${{ !cancelled() }}
        run: python3 ../scripts/ci/ci_report.py --label "Flutter" --flutter-json reports/flutter.json --floor flutter --skips flutter --coverage coverage/lcov.info
      - name: Coverage no-regression + changed lines
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ needs.context.outputs.base }}
        run: |
          python3 ../scripts/ci/coverage_gate.py --layer flutter --report coverage/lcov.info --base-ref "$BASE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reports-flutter
          path: |
            app/reports/
            app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  flutter-android:
    name: Flutter Android build (debug) + APK checks
    needs: [flutter-unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle   # ~/.gradle caches + wrapper, keyed on *.gradle* files
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # app/android/gradle.properties asks for an 8 GB heap (Flutter template);
      # the user-level file overrides it so Gradle + Kotlin daemons fit the
      # 16 GB runner with headroom.
      - name: Bound Gradle memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
      # DEBUG build only. Release signing is not configured in CI (no keystore
      # or passwords exist here, by design), and a release build must never be
      # signed with the debug key (android_check.py, EXC-ANDROID-01).
      - name: flutter build apk --debug (compile proof, arm64)
        run: flutter build apk --debug --target-platform android-arm64
      - name: Android config + APK identity, mode, exported components, permissions, secrets
        run: python3 ../scripts/ci/android_check.py --apk build/app/outputs/flutter-apk/app-debug.apk --mode debug
      - name: Artifact manifest (commit, SHA-256, build mode)
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 ../scripts/ci/artifact_manifest.py --mode debug-not-distributable --out build/app/outputs/flutter-apk app-debug.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: android-debug-apk-${{ github.sha }}-NOT-FOR-DISTRIBUTION
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/ARTIFACT-MANIFEST.json
          retention-days: 7

  # --------------------------------------------------------------- gate
  # The ONE check branch protection should require. It fails unless every
  # upstream job succeeded -- failed, cancelled and skipped all count as not
  # passing, because every job above is unconditional. workflow-policy fails
  # if a job is ever added without being listed here.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - context
      - workflow-policy
      - secret-scan
      - dependency-audit
      - backend-unit
      - backend-startup
      - migration-static
      - backend-db-integration
      - migration-upgrade
      - rls-security
      - openapi-contract
      - web-unit
      - web-build
      - playwright-mock
      - flutter-unit
      - flutter-android
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      # Logic + synthetic-status self-test: scripts/ci/ci_gate.sh, ci_gate_selftest.sh
      - name: Every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci/ci_gate.sh
